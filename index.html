<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="style/media-quiers.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="https://googleapis.com">

    <title>PROJETO LOGIN</title>



</head>

<body>
    <main>
        <section id="area_login">
            <div id="imagem">
            </div>

            <div class="coluna">
                <div id="login">
                    <h1>Login</h1>
                    <p>Seja bem vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações  no seu ambiente.</p>
                    <form action="login.php" method="post" autocomplete="on"></form>
                </div>
                <div id="formulario">
                    <div class="campo">
                       <i class="material-icons">login</i>
                        <input type="email" name="login" id="ilogin" placeholder="Login" autocomplete="email" maxlength="30">
                        <label for="ilogin">Login</label>
                    </div>
                    <div class="campo">
                        <i class="material-icons">key</i>
                        <input type="password" name="senha" id="isenha" placeholder="Senha" required autocomplete="current-password"  minlength="8" maxlength="20">
                        <label for="ilogin">Senha</label>
                    </div>
                    <div class="buttons">
                        <input type="submit" value="Entrar">
                        <a href="cadastro.html">Equeceu a Senha? <i class="material-icons">email</i></a>
                    </div>
                </div>
            </div>


        </section>
    </main>
    




</body>

</html>
